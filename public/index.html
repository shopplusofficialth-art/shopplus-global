<!--
  ShopPlus Global — Merchant App — Pending Queue (Module 2 Homework, Part B)

  Based on: 03-development/prototypes/v1/merchant-pending-queue-live.html
  (PT-005-01) — same Feature/FR/US traceability (FT-005, FR-019/FR-021,
  US-004/US-005). This is the REAL app entry point (public/ = Firebase
  Hosting root, see Part D) — the file under 03-development/prototypes/
  is left untouched as the historical mockup/live-read artifact.

  Scope decision reference: SCOPE.md at the repo root.

  What this page does now (Part B — real CRUD, no auth yet):
  - READ:   transactions where status == "PENDING_APPROVAL" (real Firestore)
  - UPDATE: Approve → status = "APPROVED" (only that field)
            Reject  → status = "REJECTED" + rejectionReason (required,
                       prompted from the user) — decided with the user
                       that rejection must always carry a reason
  - DELETE: only allowed while status == "PENDING_APPROVAL" (decided with
            the user — approved/rejected records are kept for audit per
            CLAUDE.md Section 4). Always asks for confirmation first.

  Not yet done (comes in later parts of this homework):
  - No login yet → no ACL/role-based button restriction, no real uid on
    the "actorId" of write-back events, no Firestore Security Rules
    (still relies on Firestore test mode) — see CLAUDE.md Section 14 and
    Part C/D of this homework.
-->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShopPlus Merchant — Pending Queue</title>
<style>
  :root {
    --sp-green: #0f7a5c;
    --sp-green-dark: #0b5c45;
    --sp-bg: #f4f7f6;
    --sp-card: #ffffff;
    --sp-border: #e1e6e4;
    --sp-text: #1c2622;
    --sp-muted: #6b7a75;
    --sp-danger: #c0392b;
    --sp-danger-bg: #fdecea;
    --sp-approved-bg: #e8f6f0;
    --sp-warning-bg: #e6f0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--sp-bg);
    color: var(--sp-text);
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .device {
    width: 100%;
    max-width: 430px;
    background: var(--sp-card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  header.app-bar {
    background: var(--sp-green);
    color: white;
    padding: 18px 16px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  header.app-bar .shop-name {
    font-size: 13px;
    opacity: 0.85;
    margin: 0 0 2px;
  }
  header.app-bar h1 {
    font-size: 19px;
    margin: 0;
  }
  a.btn-new {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  a.btn-new:hover { background: rgba(255,255,255,0.28); }
  a.btn-new[hidden] { display: none; }
  .queue-summary {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--sp-muted);
    border-bottom: 1px solid var(--sp-border);
  }
  .queue-summary strong { color: var(--sp-text); }
  ul.tx-list { list-style: none; margin: 0; padding: 0; }
  li.tx-card {
    padding: 14px 16px;
    border-bottom: 1px solid var(--sp-border);
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  li.tx-loading, li.tx-empty, li.tx-error {
    padding: 20px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--sp-muted);
  }
  li.tx-error { color: var(--sp-danger); }
  .tx-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .tx-ref { font-weight: 600; font-size: 14px; }
  .tx-amount { font-weight: 700; font-size: 15px; color: var(--sp-green-dark); }
  .tx-meta { font-size: 12px; color: var(--sp-muted); margin-bottom: 10px; }
  .tx-actions { display: flex; gap: 8px; }
  button.btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.btn-approve { background: var(--sp-green); color: white; }
  button.btn-approve:hover { background: var(--sp-green-dark); }
  button.btn-reject { background: #f5eceb; color: var(--sp-danger); }
  button.btn-reject:hover { background: #f0d9d6; }
  button.btn-delete { background: var(--sp-bg); color: var(--sp-muted); border: 1px solid var(--sp-border); flex: 0.6; }
  button.btn-delete:hover { background: #ebeeed; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  footer.note {
    padding: 12px 16px 16px;
    font-size: 11px;
    color: var(--sp-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="device">
    <header class="app-bar">
      <div>
        <p class="shop-name" id="current-user-label">ShopPlus</p>
        <h1 id="page-title">Pending Queue</h1>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        <a class="btn-new" href="new-transaction.html" id="new-tx-link" hidden>+ สร้างรายการ</a>
        <a class="btn-new" href="#" id="logout-link">ออกจากระบบ</a>
      </div>
    </header>

    <div class="queue-summary">
      <span id="queue-summary-label">รายการรอดำเนินการ</span>
      <strong id="pending-count">กำลังโหลด...</strong>
    </div>

    <ul class="tx-list" id="tx-list">
      <li class="tx-loading">กำลังโหลดข้อมูลจาก Firestore...</li>
    </ul>

    <footer class="note">
      FT-005 · FR-019 / FR-021 · US-004 / US-005 — Module 2 homework (Part B: real CRUD)
    </footer>
  </div>

<script type="module">
  import { db } from "./firebase-init.js";
  import { requireLogin, logout } from "./auth-guard.js";
  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    addDoc,
    serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const listEl = document.getElementById("tx-list");
  const countEl = document.getElementById("pending-count");
  const userLabelEl = document.getElementById("current-user-label");
  const logoutLinkEl = document.getElementById("logout-link");
  const newTxLinkEl = document.getElementById("new-tx-link");
  const pageTitleEl = document.getElementById("page-title");
  const queueSummaryLabelEl = document.getElementById("queue-summary-label");

  let currentUser = null;
  let currentProfile = null;

  // ACL (ดู ACL.md): มีแค่ 2 role ที่ enforce จริงรอบนี้ — MERCHANT กับ
  // CUSTOMER (ค่าอื่น/ไม่มี profile ถือเป็น CUSTOMER แบบระมัดระวังไว้ก่อน
  // เพื่อไม่ให้เห็นข้อมูลเกินสิทธิ์โดยไม่ตั้งใจ)
  function isMerchant() {
    return currentProfile?.role === "MERCHANT";
  }

  logoutLinkEl.addEventListener("click", (e) => {
    e.preventDefault();
    logout();
  });

  function renderTransaction(id, tx) {
    const li = document.createElement("li");
    li.className = "tx-card";
    li.dataset.id = id;
    li.dataset.customerId = tx.customerId || "";

    const customerLabel = tx.customerName || tx.customerId || "(ไม่ทราบชื่อ)";
    const merchantLabel = tx.merchantName || tx.merchantId || "(ไม่ทราบร้าน)";
    const amount = typeof tx.purchaseAmount === "number" ? tx.purchaseAmount.toFixed(2) : "-";
    const minAmount = typeof tx.minimumPurchaseAmount === "number" ? tx.minimumPurchaseAmount : "-";

    // ACL: อนุมัติ/ปฏิเสธ = สิทธิ์ MERCHANT เท่านั้น, ลบ = สิทธิ์ CUSTOMER
    // เจ้าของรายการเท่านั้น (ดู ACL.md ตารางสิทธิ์)
    const actionsHtml = isMerchant()
      ? '<button class="btn btn-reject" data-action="reject">ปฏิเสธ</button>' +
        '<button class="btn btn-approve" data-action="approve">อนุมัติ</button>'
      : (tx.customerId === currentUser?.uid
          ? '<button class="btn btn-delete" data-action="delete">ลบ</button>'
          : "");

    li.innerHTML =
      '<div class="tx-top">' +
        '<span class="tx-ref">' + customerLabel + " → " + merchantLabel + "</span>" +
        '<span class="tx-amount">฿ ' + amount + "</span>" +
      "</div>" +
      '<div class="tx-meta">ยอดซื้อขั้นต่ำร้าน: ฿ ' + minAmount + " · รหัส: " + id + "</div>" +
      (actionsHtml ? '<div class="tx-actions">' + actionsHtml + "</div>" : "");

    return li;
  }

  async function loadPendingQueue() {
    try {
      listEl.innerHTML = '<li class="tx-loading">กำลังโหลดข้อมูลจาก Firestore...</li>';

      // ACL: MERCHANT เห็นคิวทั้งหมดของทุกลูกค้า, CUSTOMER เห็นเฉพาะ
      // รายการของตัวเอง (ดู ACL.md เกณฑ์ข้อ ③ "ดูของคนอื่นไม่ได้")
      const q = isMerchant()
        ? query(collection(db, "transactions"), where("status", "==", "PENDING_APPROVAL"))
        : query(
            collection(db, "transactions"),
            where("status", "==", "PENDING_APPROVAL"),
            where("customerId", "==", currentUser.uid)
          );
      const snapshot = await getDocs(q);

      listEl.innerHTML = "";

      if (snapshot.empty) {
        listEl.innerHTML = '<li class="tx-empty">ไม่มีรายการรอดำเนินการ</li>';
        countEl.textContent = "0 รายการ";
        return;
      }

      snapshot.forEach((docSnap) => {
        listEl.appendChild(renderTransaction(docSnap.id, docSnap.data()));
      });

      countEl.textContent = snapshot.size + " รายการ";
    } catch (err) {
      console.error("Failed to load transactions:", err);
      listEl.innerHTML = '<li class="tx-error">โหลดข้อมูลไม่สำเร็จ — เช็ค Firestore Rules (ต้องเป็น test mode) และ console (F12) สำหรับรายละเอียด</li>';
      countEl.textContent = "-";
    }
  }

  function setCardBusy(card, busy) {
    card.querySelectorAll("button").forEach((b) => (b.disabled = busy));
  }

  // แก้เฉพาะช่อง status (+ rejectionReason เมื่อปฏิเสธ ตามที่ตกลงกับผู้ใช้)
  // ช่องอื่นของ transaction เดิมไม่ถูกแตะต้อง
  async function approveTx(id, card) {
    // Defense-in-depth: ปุ่มนี้ถูกซ่อนสำหรับ CUSTOMER อยู่แล้ว (ดู
    // renderTransaction) แต่เช็คซ้ำอีกชั้นก่อนเขียนจริง — นี่ยังเป็นแค่
    // UI check ไม่ใช่ความปลอดภัยจริง (ของจริงอยู่ที่ Security Rules)
    if (!isMerchant()) {
      alert("บัญชีนี้ไม่มีสิทธิ์อนุมัติรายการ");
      return;
    }
    setCardBusy(card, true);
    try {
      await updateDoc(doc(db, "transactions", id), { status: "APPROVED" });
      await addDoc(collection(db, "transactions", id, "events"), {
        eventType: "APPROVED",
        actorId: currentUser?.uid || null,
        actorRole: currentProfile?.role || "MERCHANT",
        timestamp: serverTimestamp(),
      });
      await loadPendingQueue();
    } catch (err) {
      console.error("Approve failed:", err);
      alert("อนุมัติไม่สำเร็จ: " + err.message);
      setCardBusy(card, false);
    }
  }

  async function rejectTx(id, card) {
    if (!isMerchant()) {
      alert("บัญชีนี้ไม่มีสิทธิ์ปฏิเสธรายการ");
      return;
    }
    const reason = prompt("กรุณาระบุเหตุผลที่ปฏิเสธรายการนี้ (จำเป็นต้องกรอก):", "");
    if (reason === null) return; // ผู้ใช้กดยกเลิก
    const trimmed = reason.trim();
    if (!trimmed) {
      alert("ต้องระบุเหตุผลก่อนปฏิเสธรายการ");
      return;
    }

    setCardBusy(card, true);
    try {
      await updateDoc(doc(db, "transactions", id), {
        status: "REJECTED",
        rejectionReason: trimmed,
      });
      await addDoc(collection(db, "transactions", id, "events"), {
        eventType: "REJECTED",
        actorId: currentUser?.uid || null,
        actorRole: currentProfile?.role || "MERCHANT",
        timestamp: serverTimestamp(),
      });
      await loadPendingQueue();
    } catch (err) {
      console.error("Reject failed:", err);
      alert("ปฏิเสธไม่สำเร็จ: " + err.message);
      setCardBusy(card, false);
    }
  }

  // ลบได้เฉพาะรายการที่ยังเป็น PENDING_APPROVAL เท่านั้น (ตามที่ตกลงกับผู้ใช้)
  // หน้านี้แสดงเฉพาะรายการ PENDING_APPROVAL อยู่แล้ว จึงลบได้ทุกใบที่เห็นในหน้านี้
  async function deleteTx(id, card) {
    // ACL: ลบได้เฉพาะ CUSTOMER เจ้าของรายการเท่านั้น (ดู ACL.md)
    if (isMerchant() || card.dataset.customerId !== currentUser?.uid) {
      alert("บัญชีนี้ไม่มีสิทธิ์ลบรายการนี้");
      return;
    }
    const confirmed = confirm("ยืนยันลบรายการนี้ถาวร? การลบนี้ไม่สามารถย้อนกลับได้");
    if (!confirmed) return;

    setCardBusy(card, true);
    try {
      await deleteDoc(doc(db, "transactions", id));
      await loadPendingQueue();
    } catch (err) {
      console.error("Delete failed:", err);
      alert("ลบไม่สำเร็จ: " + err.message);
      setCardBusy(card, false);
    }
  }

  listEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const card = btn.closest("li.tx-card");
    const id = card.dataset.id;

    if (btn.dataset.action === "approve") approveTx(id, card);
    else if (btn.dataset.action === "reject") rejectTx(id, card);
    else if (btn.dataset.action === "delete") deleteTx(id, card);
  });

  // กฎขั้นต่ำ: ต้องล็อกอินก่อนถึงจะเห็นข้อมูลได้ — ไม่ล็อกอินเด้งไป login.html
  requireLogin((user, profile) => {
    currentUser = user;
    currentProfile = profile;

    const roleLabel = isMerchant() ? "ShopPlus Merchant" : "ShopPlus Customer";
    userLabelEl.textContent = roleLabel + " · " + (profile?.displayName || user.email);

    if (isMerchant()) {
      pageTitleEl.textContent = "Pending Queue";
      queueSummaryLabelEl.textContent = "รายการรอดำเนินการ (ทุกลูกค้า)";
      newTxLinkEl.hidden = true; // ACL: Merchant ไม่สร้างรายการ
    } else {
      pageTitleEl.textContent = "รายการของฉัน";
      queueSummaryLabelEl.textContent = "รายการที่รอดำเนินการของฉัน";
      newTxLinkEl.hidden = false;
    }

    loadPendingQueue();
  });
</script>
</body>
</html>
